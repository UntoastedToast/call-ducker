name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distributions:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora 43
            image: fedora:43
            family: fedora
          - name: Arch Linux
            image: archlinux:base-devel
            family: arch
          - name: Debian 13
            image: debian:13
            family: debian
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            family: debian
    container: ${{ matrix.image }}
    env:
      PACKAGE_FAMILY: ${{ matrix.family }}
    steps:
      - name: Install Git for checkout
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          case "${PACKAGE_FAMILY}" in
            fedora) dnf install -y git ;;
            debian) apt-get update && apt-get install -y git ;;
            arch) pacman -Syu --noconfirm git ;;
          esac

      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: ./scripts/ci/setup-container.sh "${PACKAGE_FAMILY}" build

      - name: Build and test
        run: |
          meson setup build -Dintegration_tests=enabled
          meson compile -C build
          meson test -C build --print-errorlogs

  quality:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: fedora:43
    steps:
      - name: Install Git for checkout
        run: dnf install -y git

      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install build and quality dependencies
        run: ./scripts/ci/setup-container.sh fedora quality

      - name: Format, metadata, build, and test gate
        env:
          CALL_DUCKER_INTEGRATION_TESTS: enabled
        run: ./scripts/check-quality.sh build-quality

  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: fedora:43
    steps:
      - name: Install Git for checkout
        run: dnf install -y git

      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install build and sanitizer dependencies
        run: ./scripts/ci/setup-container.sh fedora sanitize

      - name: Build and test with ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          meson setup build-sanitize -Db_sanitize=address,undefined -Db_lundef=false \
            -Dintegration_tests=enabled
          meson compile -C build-sanitize
          meson test -C build-sanitize --print-errorlogs

  packaging:
    name: Packaging
    uses: ./.github/workflows/package.yml
